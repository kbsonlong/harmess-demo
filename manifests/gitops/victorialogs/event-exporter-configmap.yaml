apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter-config
  namespace: observability
  labels:
    app: event-exporter
data:
  config.yaml: |
    logLevel: info
    logFormat: json
    maxEventAgeSeconds: 600
    kubeQPS: 50
    kubeBurst: 100
    route:
      routes:
        - match:
            - receiver: "victorialogs"
    receivers:
      - name: "victorialogs"
        webhook:
          endpoint: "http://victorialogs.observability.svc:9428/insert/jsonline?_stream_fields=stream,namespace,kind,name,reason,type&_msg_field=message&_time_field=time"
          headers:
            Content-Type: "application/stream+json"
          layout:
            stream: "k8s-events"
            time: "{{ .GetTimestampISO8601 }}"
            message: "{{ .Message }}"
            reason: "{{ .Reason }}"
            type: "{{ .Type }}"
            namespace: "{{ .Namespace }}"
            kind: "{{ .InvolvedObject.Kind }}"
            name: "{{ .InvolvedObject.Name }}"
            involved_namespace: "{{ .InvolvedObject.Namespace }}"
            involved_uid: "{{ .InvolvedObject.UID }}"
            component: "{{ .Source.Component }}"
            host: "{{ .Source.Host }}"
