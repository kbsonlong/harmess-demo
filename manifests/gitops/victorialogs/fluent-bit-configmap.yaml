apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Read_from_Head    Off

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [FILTER]
        Name   lua
        Match  kube.*
        script /fluent-bit/etc/enrich.lua
        call   enrich_k8s_fields

    [OUTPUT]
        Name            http
        Match           kube.*
        host            victorialogs.observability.svc
        port            9428
        uri             /insert/jsonline?_stream_fields=namespace,pod,container&_msg_field=log&_time_field=time
        format          json_lines
        json_date_key   time
        json_date_format iso8601
        compress        gzip

  enrich.lua: |
    function enrich_k8s_fields(tag, ts, record)
        local k8s = record["kubernetes"]
        if k8s ~= nil then
            record["namespace"] = k8s["namespace_name"]
            record["pod"] = k8s["pod_name"]
            record["container"] = k8s["container_name"]
            record["node"] = k8s["host"]
            local labels = k8s["labels"]
            if labels ~= nil then
                record["app"] = labels["app"] or labels["app.kubernetes.io/name"]
                record["release_id"] = labels["release_id"] or labels["release-id"]
            end
        end
        return 1, ts, record
    end
