apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: observability
  labels:
    app: victorialogs
spec:
  selector:
    app: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: observability
  labels:
    app: victorialogs
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: victorialogs
          image: docker.io/victoriametrics/victoria-logs:v1.50.0
          args:
            - -storageDataPath=/victoria-logs-data
          ports:
            - containerPort: 9428
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
