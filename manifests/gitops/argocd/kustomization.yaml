apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.12.4/manifests/install.yaml

patches:
  - target:
      kind: Service
      name: argocd-server
      namespace: argocd
    path: argocd-server-service-nodeport.patch.yaml
