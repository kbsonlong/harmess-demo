apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-sandbox-sa
  namespace: default
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-sandbox-cluster-readonly
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - nodes
  - pods
  - pods/log
  - services
  - endpoints
  - events
  - configmaps
  - persistentvolumes
  - persistentvolumeclaims
  - resourcequotas
  - limitranges
  verbs: ["get","list","watch"]
- apiGroups: ["apps"]
  resources: ["deployments","replicasets","statefulsets","daemonsets"]
  verbs: ["get","list","watch"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["get","list","watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get","list","watch"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
- nonResourceURLs: ["/version","/version/"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-sandbox-cluster-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-sandbox-cluster-readonly
subjects:
- kind: ServiceAccount
  name: k8s-sandbox-sa
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: k8s-sandbox
  namespace: default
  labels:
    app: k8s-sandbox
spec:
  restartPolicy: Never
  serviceAccountName: k8s-sandbox-sa
  nodeSelector:
    biz.type: common
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: tmp
    emptyDir: {}
  containers:
  - name: sandbox
    image: registry.cn-hangzhou.aliyuncs.com/seam/sandbox-inspector:latest@sha256:39d2ff2eabddc97d0d29a22d91c3211724f49bded2f3e
    imagePullPolicy: IfNotPresent
    command: ["sleep","infinity"]
    env:
    - name: SANDBOX_INSECURE_SKIP_TLS_VERIFY
      value: "true"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    volumeMounts:
    - name: tmp
      mountPath: /tmp
